[package]
name = "authplane-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Authplane adapter helpers for the official Rust MCP SDK."
readme = "README.md"
keywords = ["oauth", "jwt", "mcp", "adapter", "authplane"]
categories = ["authentication", "api-bindings"]

# Tests, examples and benches are not shipped in the published crate. They are
# not what a consumer compiles against, they are all readable in the repository,
# and `core/tests/fixtures/` holds RSA and EC private keys the unit tests and the
# DPoP example use. Those keys are test material — nothing verifies against them —
# but a crates.io version is immutable, so anything that ships stays shipped, and
# key-shaped files in a published tarball are permanent noise for every downstream
# secret scanner and SBOM. Keeping them out of the tarball costs nothing here.
#
# `examples/` goes with `tests/` rather than staying behind: the DPoP example
# reads `tests/fixtures/test-private.pem` through `include_str!`, so shipping the
# example without the fixture would leave it unbuildable from the tarball.
exclude = ["tests/", "examples/", "benches/"]

[dependencies]
authplane-sdk = { path = "../core", version = "0.1.0" }
axum = "0.8"
http = "1"
rmcp = { version = "1.4.0", features = ["transport-streamable-http-server", "transport-streamable-http-server-session"] }
serde_json = "1"
url = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
jsonwebtoken = { version = "9", features = ["use_pem"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
schemars = "1.2.1"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }

# Runnable demo lives in `demo/` (not `examples/`) alongside its `README.md`
# and `run.sh`. Cargo's example auto-discovery is opt-in via this explicit
# entry; `cargo run --example http_calculator_demo` still works.
[[example]]
name = "http_calculator_demo"
path = "demo/http_calculator_demo.rs"
